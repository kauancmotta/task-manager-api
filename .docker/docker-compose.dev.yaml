services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: taskDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "TaskManagerDevelopment"
    networks:
      - db
    ports:
      - "5432:5432"
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web

networks:
  db:
    driver: bridge