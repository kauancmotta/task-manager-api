services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: taskDB_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "TaskManagerDevelopment"
    networks:
      - db
    ports:
      - "5433:5432"
      
  mailhog-test:
    image: mailhog/mailhog
    user: root
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web

networks:
  db:
    driver: bridge