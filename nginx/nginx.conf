worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ---------------------------------------------------------------------------
  # Logging
  # ---------------------------------------------------------------------------
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ---------------------------------------------------------------------------
  # Rate limit zones
  # ---------------------------------------------------------------------------

  # General API: 30 req/s per IP
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

  # Auth routes: 5 req/s per IP (stricter — login, register, forgot-password)
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

  # Return 429 Too Many Requests instead of default 503
  limit_req_status 429;

  # ---------------------------------------------------------------------------
  # Upstream
  # ---------------------------------------------------------------------------
  upstream api {
    server api:3001;
    keepalive 32;
  }

  # ---------------------------------------------------------------------------
  # Server
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer"     always;

    # Hide Nginx version
    server_tokens off;

    # Max body size (file uploads)
    client_max_body_size 10M;

    # ------------------------------------------------------------------
    # Auth routes — strict rate limit
    # ------------------------------------------------------------------
    location /api/auth/ {
      limit_req zone=api_auth burst=10 nodelay;

      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # All other API routes — general rate limit
    # ------------------------------------------------------------------
    location /api/ {
      limit_req zone=api_general burst=50 nodelay;

      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    
    location / {
      return 404;
    }
    
  }
}